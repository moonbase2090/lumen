name: Links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # This repository's own files on github.com are checked against the
      # tree here, not over the network: github.com answers CI runners with
      # 429 and 503 under load, which turned a required check red with no
      # broken link, and a link to a file added in the same change cannot be
      # fetched from main before it merges.
      - name: In-repo github.com links resolve in the tree
        run: scripts/check-repo-links.sh
      - uses: moonbase2090/.github/actions/package-links@93645e58a5c6e815a7aa167444dcf1a3c2bb5267
        with:
          # domterm.org answers some GitHub-hosted runners at once and others
          # not at all: failed runs time out on it through every retry (2m20s)
          # while a run minutes earlier or later on the same branch passes in
          # about a second. A required check must not depend on which runner it
          # gets, so the host is checked only by link-check-external in ci.yml,
          # which scans spec/**/*.md and does not block a merge.
          link-excludes: >-
            --exclude '^https?://domterm\.org/'
            --exclude '^https://github\.com/moonbase2090/lumen/(blob|tree)/main/'
