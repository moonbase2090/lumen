[package]
name = "lumen-track0"
description = "Parser for unverified (Track 0) inert rich blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The spec's rules for zero-width and bidi characters in paragraph and heading
# text: every code point is kept and open bidi controls are closed at each line
# and block end. Off by default, which keeps the earlier rule (bidi controls
# shown as \\u{..} escapes); turning it on by default is its own change.
zero-width-text = []

[lints]
workspace = true
