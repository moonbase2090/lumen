[package]
name = "lumen-track0"
description = "Parser for unverified (Track 0) inert rich blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["zero-width-text"]
# The spec's rules for zero-width and bidi characters in paragraph and heading
# text: every code point is kept and open bidi controls are closed at each line
# and block end. On by default; building without default features keeps the
# earlier rule (bidi controls shown as `\u{..}` escapes).
zero-width-text = []

[lints]
workspace = true
