description = "Test-only driver that replays a corpus through an arm's layer and writes the comparison run log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lumen-arm-a = { path = "../lumen-arm-a" }
