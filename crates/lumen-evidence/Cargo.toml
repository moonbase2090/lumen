lumen-detector = { path = "../lumen-detector" }
lumen-harness = { path = "../lumen-harness" }
lumen-panes = { path = "../lumen-panes" }
lumen-sinks = { path = "../lumen-sinks" }
lumen-sealed = { path = "../lumen-sealed" }
lumen-term = { path = "../lumen-term", features = ["arm-b"] }
