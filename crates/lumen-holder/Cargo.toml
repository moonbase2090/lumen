[package]
name = "lumen-holder"
description = "The key-holder process: one per sealed layer, never forks or execs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lumen-holder"
path = "src/main.rs"

[dependencies]
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Not `workspace = true`: this crate has one named FFI module (`ffi_linux`)
# that needs `unsafe`, so the crate root denies unsafe code instead of
# forbidding it.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
