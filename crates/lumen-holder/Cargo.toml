[package]
name = "lumen-holder"
description = "The key-holder process: one per sealed layer, never forks or execs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The seal request on the seal channel: the holder seals command-structure
# frames when the shell asks. Off by default, so a holder built without it
# treats a seal request as an unknown message type; turning it on by default
# is its own change.
seal-requests = []

[[bin]]
name = "lumen-holder"
path = "src/main.rs"

[dependencies]
lumen-sealed = { path = "../lumen-sealed" }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
lumen-seal = { path = "../lumen-seal" }

[dev-dependencies]
lumen-arm-b = { path = "../lumen-arm-b" }
lumen-detector = { path = "../lumen-detector" }

# Not `workspace = true`: this crate has one named FFI module (`ffi_linux`)
# that needs `unsafe`, so the crate root denies unsafe code instead of
# forbidding it.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
