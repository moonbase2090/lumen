[package]
name = "lumen-term"
description = "The Lumen terminal: blocks on the upstream VT core, with the arm layer between the PTY and the grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The window: winit and softbuffer. Off by default so the headless crate builds
# without them; the tests turn it on.
window = ["dep:winit", "dep:softbuffer"]

[[bin]]
name = "lumen-term"
path = "src/main.rs"

[dependencies]
prismattyc-core.workspace = true
prismattyc-emulator.workspace = true
lumen-track0 = { path = "../lumen-track0" }
swash = "0.2"
png = "0.17"
lumen-arm-b = { path = "../lumen-arm-b" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"], optional = true }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"], optional = true }

[dev-dependencies]
# The tests build the window code, so a self-dependency turns the feature on.
lumen-term = { path = ".", features = ["window"] }
lumen-detector = { path = "../lumen-detector" }
sha2 = "0.10"

[lints]
workspace = true
