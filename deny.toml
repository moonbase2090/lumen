[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Reviewed 2026-10-29. Each entry names what it covers and when to look again.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and has no safe upgrade. It is reached only through fontdue, which parses the one face compiled into lumen-term (IBM Plex Mono, pinned by hash in NOTICE.txt), never a file the user or a program supplies. Revisit before any system or user font is loaded, and when fontdue changes its parser." },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/moonbase2090/Prismattyc"]
